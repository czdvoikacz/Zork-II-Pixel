<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>ZORK II česky</title>
<style>
:root {
  --bg: #111214;
  --panel: #191b20;
  --line: #2c2f37;
  --fg: #e8e3d4;
  --dim: #8b8e98;
  --gold: #d9a441;
  --gold-bg: #463412;
  --cmd: #d9a441;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { overflow: hidden; width: 100%;
  margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 15px/1.35 "Segoe UI", Roboto, "Noto Sans", sans-serif;
  overscroll-behavior: none;
}
button {
  font: inherit; color: var(--fg); background: #24272e; border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 8px; touch-action: manipulation;
}
button:active { background: #33373f; }

#app {
  display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  max-width: 900px; margin: 0 auto;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

/* ---- obrázek */
#picbox { position: relative; flex: none; width: 100%; aspect-ratio: 480 / 272; background: #050506; }
#pic {
  width: 100%; height: 100%; display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#picmsg {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-style: italic; text-align: center; padding: 10px; pointer-events: none;
}
#picname {
  position: absolute; left: 8px; bottom: 6px; font: bold 17px Georgia, serif;
  color: #f3e9cf; text-shadow: 0 1px 3px #000, 0 0 8px #000;
}
#picbtns { position: absolute; right: 6px; top: 6px; display: flex; gap: 6px; }
#picbtns button { background: rgba(0,0,0,.55); border-color: rgba(255,255,255,.25); min-width: 38px; }
#picbtns button.on { color: var(--gold); border-color: var(--gold); }

/* ---- mapa a inventář */
#mid { flex: none; display: flex; gap: 6px; padding: 6px 6px 0; height: 25vh; min-height: 130px; max-height: 210px; }
#mapbox, #invbox {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
#mapbox { flex: 1.7; min-width: 0; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#invbox { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.boxtitle { position: absolute; left: 8px; top: 4px; font-size: 11px; letter-spacing: .08em; color: var(--gold); font-weight: bold; pointer-events: none; }
#mapbtns { position: absolute; right: 4px; top: 4px; display: flex; gap: 4px; }
#mapbtns .mini { min-width: 30px; }
.mini { padding: 2px 7px; font-size: 13px; background: rgba(36,39,46,.85); }
#inv { list-style: none; margin: 22px 0 0; padding: 0 6px 6px; overflow-y: auto; flex: 1; }
#inv li { padding: 5px 6px; border-bottom: 1px solid #23252b; font-size: 14px; }
#inv li:active { background: #2a2d35; }
#inv li.empty { color: var(--dim); font-style: italic; border: 0; }

/* ---- směry */
#pad { flex: none; display: flex; gap: 6px; padding: 6px; }
#compass { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; flex: 1.7; min-width: 0; }
#extra { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; flex: 1; min-width: 0; }
#pad button { padding: 7px 2px; font-size: 13px; color: #6e717b; background: #1a1c21; }
#pad button.on { color: #fbf3dc; background: var(--gold-bg); border-color: #7a5a1c; font-weight: 600; }
#pad button.look { color: var(--fg); }

/* ---- text */
#status { flex: none; padding: 2px 10px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--line); }
#log {
  flex: 1; min-height: 80px; overflow-y: auto; padding: 4px 10px 8px;
  white-space: pre-wrap; word-wrap: break-word; -webkit-overflow-scrolling: touch;
}
#log .cmd { color: var(--cmd); font-weight: 600; margin-top: 6px; }
#log .sys { color: var(--dim); font-style: italic; }

/* ---- příkazový řádek */
#cmdform { flex: none; display: flex; gap: 5px; padding: 6px; border-top: 1px solid var(--line); background: #15161a; }
#cmd {
  flex: 1; min-width: 0; font: 16px "Segoe UI", Roboto, sans-serif; color: var(--fg);
  background: #0c0d0f; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
#cmd:focus { outline: none; border-color: var(--gold); }
#btnSend { background: var(--gold-bg); border-color: #7a5a1c; }

/* při psaní (otevřená klávesnice) schovat mapu a směry, ať je vidět text */
body.typing #mid, body.typing #pad { display: none; }

/* ---- spodní listy (nápověda, menu, dialogy) */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 85vh; overflow-y: auto;
  background: #1b1d22; border-top: 2px solid var(--gold); border-radius: 14px 14px 0 0;
  padding: 10px 12px 18px; z-index: 10; box-shadow: 0 -8px 30px rgba(0,0,0,.6);
}
.sheet.hidden { display: none; }
.sheethead { font-weight: bold; color: var(--gold); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sheethead .hint { color: var(--dim); font-weight: normal; font-size: 12px; flex: 1; }
.sheethead .close { margin-left: auto; }
#helpbody h4 { margin: 10px 0 4px; color: var(--gold); font-size: 13px; letter-spacing: .06em; }
#helpbody .verbs { display: flex; flex-wrap: wrap; gap: 5px; }
#helpbody .verbs button { font-size: 14px; padding: 6px 9px; }
#helpbody .verbs button.static { color: var(--dim); }
#helpbody p { color: var(--dim); font-size: 13px; margin: 10px 0 0; }
#guidebody { white-space: pre-wrap; font: 13px/1.4 Consolas, "Roboto Mono", monospace; color: var(--fg); margin: 0; }
.menulist .hidden { display: none; }
.menulist { display: flex; flex-direction: column; gap: 8px; }
.menulist button { text-align: left; padding: 12px; font-size: 16px; }
#dlgbody input { width: 100%; font-size: 16px; padding: 9px; background: #0c0d0f; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; }
#dlgbody .row { display: flex; gap: 6px; margin-top: 8px; }
#dlgbody .row button { flex: 1; padding: 10px; }
#dlgbody .slot { display: flex; gap: 6px; margin-top: 6px; }
#dlgbody .slot button:first-child { flex: 1; text-align: left; }
#dlgbody .slot small { color: var(--dim); }
#dlgbody .note { color: var(--dim); font-size: 13px; }

</style>
</head>
<body>
<div id="app">
  <!-- obrázek místnosti -->
  <section id="picbox">
    <canvas id="pic" width="120" height="68"></canvas>
    <div id="picmsg"></div>
    <div id="picname"></div>
    <div id="picbtns">
      <button id="btnLike" title="Obrázek se líbí - uložit">✓</button>
      <button id="btnNext" title="Jiný obrázek">↻</button>
    </div>
  </section>

  <!-- mapa + inventář -->
  <section id="mid">
    <div id="mapbox">
      <canvas id="map"></canvas>
      <div class="boxtitle">MAPA</div>
      <div id="mapbtns"><button id="btnZoomOut" class="mini" title="Oddálit">−</button><button id="btnZoomIn" class="mini" title="Přiblížit">+</button><button id="btnCenter" class="mini" title="Vycentrovat">⌖</button></div>
    </div>
    <div id="invbox">
      <div class="boxtitle">NESEŠ</div>
      <ul id="inv"></ul>
    </div>
  </section>

  <!-- směry -->
  <section id="pad">
    <div id="compass">
      <button data-d="NW">SZ</button><button data-d="NORTH">S ↑</button><button data-d="NE">SV</button>
      <button data-d="WEST">← Z</button><button data-d="LOOK" class="look">👁</button><button data-d="EAST">V →</button>
      <button data-d="SW">JZ</button><button data-d="SOUTH">J ↓</button><button data-d="SE">JV</button>
    </div>
    <div id="extra">
      <button data-d="UP">▲ nahoru</button>
      <button data-d="DOWN">▼ dolů</button>
      <button data-d="IN">dovnitř</button>
      <button data-d="OUT">ven</button>
    </div>
  </section>

  <!-- text hry -->
  <section id="status"></section>
  <section id="log"></section>

  <!-- příkazový řádek -->
  <form id="cmdform" autocomplete="off">
    <button type="button" id="btnHelp" title="Nápověda sloves">?</button>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           enterkeyhint="send" placeholder="napiš příkaz…">
    <button type="submit" id="btnSend">➤</button>
    <button type="button" id="btnMenu" title="Menu">☰</button>
  </form>
</div>

<!-- nápověda sloves -->
<div id="help" class="sheet hidden">
  <div class="sheethead">Nápověda <span class="hint">ťukni na sloveso = vloží se do příkazu</span>
    <button class="close">✕</button></div>
  <div id="helpbody"></div>
</div>

<!-- menu -->
<div id="menu" class="sheet hidden">
  <div class="sheethead">Menu <button class="close">✕</button></div>
  <div class="menulist">
    <button data-act="save">💾 Uložit hru</button>
    <button data-act="restore">📂 Nahrát hru</button>
    <button data-act="pics">🖼 Obrázky zapnout/vypnout</button>
    <button data-act="mode" id="btnMode" class="hidden">🎨 Styl obrázků: pixel / kresba</button>
    <button data-act="restart">↺ Začít znovu</button>
    <button data-act="guide">📜 Návod (prozradí řešení!)</button>
    <button data-act="about">ℹ O hře</button>
  </div>
</div>

<!-- návod -->
<div id="guide" class="sheet hidden">
  <div class="sheethead">Návod <span class="hint">celé řešení hry</span> <button class="close">✕</button></div>
  <pre id="guidebody"></pre>
</div>

<!-- dialog uložení / nahrání -->
<div id="dlg" class="sheet hidden">
  <div class="sheethead"><span id="dlgtitle"></span> <button class="close">✕</button></div>
  <div id="dlgbody"></div>
</div>

tea table adorns the center of the gazebo.", "Zahrada": "Formal Garden: the middle part of a formal garden. Hedges hide the cavern walls and a dim illumination comes from mosses far above. The path is of small crushed white stones.", "Tvarované keře": "Topiary: Hedges hide the cavern walls and mosses provide dim illumination. Fantastically shaped hedges and bushes are arrayed with geometric precision. They have not recently been clipped, but you can discern creatures in the shapes of the bushes: There is a dragon, a unicorn, a great serpent, a huge misshapen dog, and several human figu", "Stezka u potoka": "Path Near Stream: a rocky path along the edge of a deep ravine with a stream below, glowing moss", "Mramorová síň": "Marble Hall: an arched hall of fine marble. Perhaps a flood or collapse of the cave was responsible. There is rather annoying whirring sound coming from that room.", "Hluboký brod": "Deep Ford: fording the stream at a deep but not impossible spot. The water is very cold.", "Římsa v rokli": "Ledge in Ravine: on a narrow ledge near the bottom of a deep ravine. A precarious climb up to another tiny ledge is possible. A short scramble down the rock face leads to a stream.", "Konec římsy": "End of Ledge: a narrow rock ledge ending at a dark tunnel entrance, warm smoky air", "Dračí sál": "Dragon Room: The room is a large cavern full of broken stone. The walls are scorched and there are deep scratches on the floor. A sooty dry smell is very strong here.", "Dračí doupě": "Dragon's Lair: in the dragon's lair, where the rock walls are scarred by flame.", "Síň fresek": "Fresco Room: It is hard to tell who is doing this as those parts of the frescoes have been blackened and cracked by intense heat.", "Kamenný most": "Stone Bridge: the middle of a ruined but still impressive stone bridge spanning a deep chasm. Water flows far beneath.", "Chladná síň": "Cool Room: The room is cool and damp. The air is misty. It is from the latter that the mist and chill seem to originate.", "Ledová síň": "Ice Room: a cavern blocked by a huge glacier of blue ice, frozen walls, cold mist, icicles", "Lávový komín": "Lava Tube: in a tight chimney of solidified lava. It extends up at least another hundred feet and down to a large room far below.", "Chodba s pavučinami": "Cobwebby Corridor: A winding corridor is filled with cobwebs. Some are broken and the dust on the floor is disturbed.", "Místnost 8": "Room 8: a small chamber carved out of the rock at the end of a short crawl. On the wall is crudely chiseled the number \\", "Síň menhiru": "Menhir Room: a large cavern with a gigantic carved standing stone menhir, ancient runes", "Psinec": "Kennel: a huge abandoned kennel for a giant dog, enormous bones scattered on the floor", "Schodiště": "Stairway: A marble stairway leads down into the gloom and a passage leads north.", "Šikmá místnost": "Oddly-angled Room: A small room with oddly angled walls and passages in all directions.", "Kerberova síň": "Cerberus Room: the entrance to a huge crypt or tomb. A marble stairway leads up from a gateway arch.", "Předsíň krypty": "Crypt Anteroom: the marble anteroom of an ancient crypt, carved stone doors, dust and shadows", "Krypta": "Crypt: a dark royal crypt with stone sarcophagi of ancient kings, carved marble, candle glow", "Odpočívadlo": "Landing: a stone landing at the top of a long stairway descending into darkness, mysterious portal", "Střežená místnost": "Guarded Room: a vaulted stone chamber guarded by a fearsome dragon statue, torchlight", "Čarodějova dílna": "Wizard's Workshop: the cluttered workshop of an old wizard, potions, alembics, glowing runes, star charts", "Čarodějova pracovna": "Wizard's Workroom: This room is the Wizard's workroom. There are many shelves and racks on the walls, but the Wizard's workbench dominates the room. It is made of dark, heavy wood bound with iron. The workbench is stained from many years of use, and is deeply gouged as though some huge clawed animal was imprisoned on it. There are burn marks and e", "Síň trofejí": "Trophy Room: the Wizard's trophy room, filled with memorabilia of various sorts. On one wall is the Wizard's D. T. (Doctor of Thaumaturgy) degree from GUE Tech. Several old magic wands are mounted on a wand rack. A collection of dull and nicked swords testify to the fate of many foolhardy adventurers. Small bottles contain discarded homuncul", "Síň pentagramu": "Pentagram Room: In this room, inscribed on the floor, is a great pentagram drawn with black chalk. In its center is a black circle.", "Síň s akváriem": "Aquarium Room: a dark hallway with a huge glass aquarium tank holding a sea serpent", "Kalná místnost": "Murky Room: The floor here seems to be made of sand, but it is hard to see anything else.", "Čarodějovy komnaty": "Wizard's Quarters: a wizard's private bedchamber with a canopy bed, robes, spell books, magical trinkets", "Kolotočová síň": "Carousel Room: a circular room with many exits around the walls, spinning magical vortex, dizzying", "Síň hádanky": "Riddle Room: a stone chamber with a heavy stone door and a riddle carved in the wall, eerie light", "Perlová komůrka": "Pearl Room: a former broom closet in a dungeon, old brooms, dusty shelves", "Dno sopky": "Volcano Bottom: at the bottom of a large dormant volcano. High above you light enters from the cone of the volcano.", "Jícen sopky": "Volcano Core: about one hundred feet above the bottom of the volcano. The top of the volcano is clearly visible here.", "Sopka u malé římsy": "Volcano Near Small Ledge: about two hundred feet above the volcano floor. Looming above is the rim of the volcano.", "Sopka u vyhlídkové římsy": "Volcano by Viewing Ledge: high above the floor of the volcano. The rim of the volcano looks very narrow and you are very near it.", "Sopka u široké římsy": "Volcano Near Wide Ledge: near the rim of the volcano. Above you it is open to the sky.", "Knihovna": "Library: This must have been a large library, probably for the royal family. All of the shelves have been gnawed to pieces by unfriendly gnomes.", "Vyhlídka do sopky": "Volcano View: on a ledge in the middle of a large volcano. Below you the volcano bottom can be seen and above is the rim of the volcano. A couple of ledges can be seen on the other side of the volcano; it appears that this ledge is intermediate in elevation between those on the other side.", "Široká římsa": "Wide Ledge: a wide rock ledge high inside a dormant volcano, a door into the rock wall, sky above", "Zaprášená místnost": "Dusty Room: a dusty abandoned room with a big iron safe embedded in the wall, cobwebs", "Lávová místnost": "Lava Room: a small room, whose walls are formed by an old lava flow.", "Nízká místnost": "Low Room: a low-ceilinged rock room with seven passages, strange magnetic shimmer, metal robot", "Strojovna": "Machine Room: a large room full of assorted heavy machinery, whirring noisily. The room smells of burned resistors. Along one wall are three buttons which are, respectively, round, triangular, and square. Naturally, above these buttons are instructions written in EBCDIC. A large sign in English above all the buttons says  \\", "Zašlá komora": "Dingy Closet: a dingy stone closet with words chiseled into the wall, a steel cage hanging above", "Klec": "Cage: trapped inside a solid steel cage.", "Ústí studny": "Top of Well: at the top of the well. Well done. There are etchings on the side of the well.", "Kruhová místnost": "Circular Room: a damp circular room, whose walls are made of brick and mortar. The roof of this room is not visible, but there appear to be some etchings on the walls.", "Čajovna": "Tea Room: a small room containing a large oblong table, no doubt set for afternoon tea. It is clear from the objects on the table that the users were indeed mad.", "Síň sloupků": "Posts Room: an enormous room, in the center of which are four wooden posts delineating a rectangular area, above which is what appears to be a wooden roof. In fact, all objects in this room appear to be abnormally large.", "Síň s jezírkem": "Pool Room: a large room, one half of which is depressed. Salty water flows from a large leak in the ceiling.", "Vstup do banky": "Bank Entrance: the entrance hall of the Bank of Zork, the largest banking institution of the Great Underground Empire. A partial account of its history is in \\", "Západní přepážka": "West Teller's Room: an old bank teller room with brass bars and counters, dusty, abandoned", "Východní přepážka": "East Teller's Room: an old bank teller room with brass bars and counters, dusty, abandoned", "Západní prohlížecí místnost": "West Viewing Room: This room was used by holders of safety deposit boxes to view their contents.", "Východní prohlížecí místnost": "East Viewing Room: This room was used by holders of safety deposit boxes to view their contents.", "Malá místnost": "Small Room: a small, bare room with no distinguishing features.", "Trezor": "Vault: the Vault of the Bank of Zork, in which there are no doors.", "Úschovna": "Safety Depository: a large rectangular bank vault room with walls of safety deposit boxes", "Kancelář předsedy": "Chairman's Office: This room was the office of the Chairman of the Bank of Zork. Like the other rooms here, it has been extensively vandalized.", "Ponurá místnost": "Dreary Room: a dreary stone room with a crystal sphere on a pedestal, gloomy grey light", "Malinká místnost": "Tiny Room: a tiny cramped stone room with a small door with a keyhole, single crystal sphere", "Síň rudé mlhy": "Room of Red Mist: a room filled with swirling red mist, glowing crimson fog", "Síň modré mlhy": "Room of Blue Mist: a room filled with swirling blue mist, glowing azure fog", "Síň bílé mlhy": "Room of White Mist: a room filled with swirling white mist, pale glowing fog", "Síň černé mlhy": "Room of Black Mist: a room filled with swirling black mist, ominous darkness"}, "pics": {"Úzký tunel": 2757314287, "Velká jeskyně": 631465797, "Lávka": 2130342047, "Síň rud 03.png", "seed": 1134967811}, "Chladná síň": {"file": "04a19476.png", "seed": 77698166}, "Chodba s pavučinami": {"file": "ae3e3411.png", "seed": 2923312145}, "Dno sopky": {"file": "fc52a3f8.png", "seed": 4233274360}, "Dračí doupě": {"file": "d5990c22.png", "seed": 3583577122}, "Dračí sál": {"file": "7d032341.png", "seed": 2097357633}, "Hluboký brod": {"file": "651e068f.png", "seed": 1696466575}, "Jícen sopky": {"file": "c2ba1d30.png", "seed": 3266977072}, "Kalná místnost": {"file": "5ce7929f.png", "seed": 1558680223}, "Kamenný most": {"file": "58542233.png", "seed": 1481908787}, "Kancelář předsedy": {"file": "e8b2ae63.png", "seed": 3904024163}, "Kerberova síň": {"file": "9b10c27f.png", "seed": 2601566847}, "Klec": {"file": "e0ad9d64.png", "seed": 3769474404}, "Knihovna": {"file": "be17b024.png", "seed": 3189223460}, "Kolotočová síň": {"file": "c7ac9d2c.png", "seed": 3349978412}, "Konec římsy": {"file": "7e3e2964.png", "seed": 2118003044}, "Kruhová místnost": {"file": "1518bf76.png", "seed": 353943414}, "Krypta": {"file": "646f82d9.png", "seed": 1685029593}, "Ledová síň": {"file": "9777d537.png", "seed": 2541212983}, "Lávka": {"file": "7efa709f.png", "seed": 2130342047}, "Lávový komín": {"file": "4aabbbba.png", "seed": 1252768698}, "Malinká místnost": {"file": "b32c0d70.png", "seed": 3006008688}, "Malá místnost": {"file": "09bc5500.png", "seed": 163337472}, "Mramorová síň": {"file": "2e181db8.png", "seed": 773332408}, "Místnost 8": {"file": "74a88a22.png", "seed": 1957202466}, "Mělký brod": {"file": "3e7469e6.png", "seed": 1047816678}, "Nízká místnost": {"file": "08e92145.png", "seed": 149496133}, "Odpočívadlo": {"file": "bbe2a39b.png", "seed": 3152192411}, "Perlová komůrka": {"file": "4de707df.png", "seed": 1306986463}, "Ponurá místnost": {"file": "427bfc94.png", "seed": 1115421844}, "Psinec": {"file": "cb68c2e8.png", "seed": 3412640488}, "Předsíň krypty": {"file": "7ae625c1.png", "seed": 2061903297}}, "guide": "ZORK II: Čaroděj z Frobozzu - NÁVOD PRO ČESKOU VERZI\n=====================================================\n\nPOZOR: Tento návod prozrazuje celé řešení hry!\n\nVšechny příkazy jsou ověřené v této české verzi - celý návod jsem nechal\nprojít hrou od začátku do konce: 400 bodů ze 400, asi 380 tahů, hodnost\n„Mistr dobrodruh“. Příkazy piš přesně tak, jak jsou tady (diakritiku psát\nnemusíš). Funguje to v okně, v konzoli i v telefonu.\n\n\nNEŽ ZAČNEŠ\n----------\n* UKLÁDEJ ČASTO. Před každou kapitolou napiš ULOŽ. Když se něco pokazí,\n  NAHRAJ tě vrátí zpátky.\n* Hra má náhodu. Čaroděj se občas objeví a sešle kouzlo (seznam je na konci).\n  Kolotočová síň tě posílá náhodně, dokud ji robot nezastaví. Návod ti u\n  takových míst řekne, co dělat.\n* Lampa svítí asi 500 tahů. Návod jich potřebuje kolem 370, tak se zbytečně\n  netoulej. Kde je světlo (zahrada, jeskyně s mechem), můžeš ji zhasnout.\n* Do ruky uneseš jen pár věcí. Poklady se proto průběžně nosí do\n  Střežené místnosti (jihozápadně od Kolotočové síně).\n* „čekej“ trvá 3 tahy. Když potřebuješ počkat jen jeden tah, napiš\n  „rozhlédni se“.\n\n\n1. ZAČÁTEK: LAMPA, MEČ A ALTÁN\n------------------------------\nvezmi meč\nvezmi lampu\nj\nj\nj\njz\nj\nrozsviť lampu\njv\ndovnitř                  (altán)\nvezmi vše                (zápalky, konvice, prostírání, noviny, nůž na dopisy)\nven\ns\nsv                       (Mělký brod)\nnaplň konvici\nj\njz\njz                       (Kolotočová síň)\npolož vše kromě lampy a konvice\n\n\n2. KOLOTOČOVÁ SÍŇ A HÁDANKA                                   (+5 bodů)\n---------------------------\nKolotočová síň se točí a posílá tě náhodně. Potřebuješ do SÍNĚ HÁDANKY.\nNapiš:\njv\nKdyž skončíš jinde, vrať se zpátky a zkus jv znovu:\n   Síň menhiru → s       Mramorová síň → j      Stezka u potoka → jz\n   Tvarované keře → z    Chodba s pavučinami → sv   Místnost 8 → v\n   Chladná síň → jv\nV Síni hádanky:\nodpověz studna\n\n\n3. STUDNA, ČAJOVNA A CUKROVÍ                                 (+25 bodů)\n----------------------------\nv                        (Perlová komůrka - náhrdelník zatím nech ležet)\nv                        (Kruhová místnost)\nvlez do vědra\nvylij vodu do vědra      (vědro vyjede nahoru)\nvystup z vědra\nv                        (Čajovna)\nvezmi zelený dortík\nvezmi červený dortík\nvezmi modrý dortík       (ORANŽOVÝ NEBER - vybuchne!)\nsněz zelený dortík       (zmenšíš se a ocitneš v Síni sloupků)\nv                        (Síň s jezírkem)\nhoď červený dortík do jezírka\nvezmi cukroví            (baňku s lebkou nech být)\nz\nsněz modrý dortík        (vyrosteš zpátky)\n\n\n4. ROBOT ZASTAVÍ KOLOTOČ A RUDÁ KOULE                        (+20 bodů)\n-------------------------------------\nsz                       (Nízká místnost s robotem)\nrobote, jdi na východ\nv                        (Strojovna)\nrobote, zmáčkni trojúhelníkové tlačítko     (kolotoč se zastaví)\nrobote, jdi na jih\nj                        (Zašlá komora)\nvezmi rudou kouli        (spadne na tebe klec - nevadí)\nrobote, zvedni klec\nvezmi rudou kouli\n\n\n5. ZPÁTKY STUDNOU: PERLY, HOUSLE A SKLAD POKLADŮ             (+35 bodů)\n-----------------------------------------------\ns\nz                        (Nízká místnost - kompas tu blázní)\njv                       (Čajovna; když skončíš jinde, zkus to znovu)\nz                        (Ústí studny)\nvlez do vědra\nnaplň konvici            (vědro sjede dolů)\nvystup z vědra\nz\nvezmi náhrdelník\nz\nsz                       (Kolotočová síň - teď už stojí)\notevři skříňku\nvezmi housle\njz\njz                       (Střežená místnost = sklad pokladů)\npolož housle\npolož cukroví\npolož náhrdelník\npolož rudou kouli\ns\nvezmi provázek\nsv\nz                        (Místnost 8)\nvezmi odpuzovač\nv\npolož provázek\npolož odpuzovač\npolož konvici\n\n\n6. DRAK                                                       (+5 bodů)\n-------\nÚtoč jen jednou v každé místnosti, jinak tě drak upeče!\nvezmi meč\nsz                       (Chladná síň)\ns                        (Kamenný most)\ns                        (Dračí sál)\nzaútoč na draka mečem\nj\nzaútoč na draka mečem\nj\nzaútoč na draka mečem\nz                        (Ledová síň - drak roztaví ledovec a zahyne)\n\n\n7. PRINCEZNA, ZLATÝ KLÍČEK A SOŠKA                           (+35 bodů)\n----------------------------------\nv\npolož meč                (meč zůstane v Chladné síni)\ns\ns\ns                        (Dračí doupě)\notevři truhlu\notevři truhlu            (napoprvé to nepovolí)\nPrincezna odejde - hned ji následuj, sošku si vezmeš později:\nnásleduj princeznu\nnásleduj princeznu       (opakuj, dokud nedojdeš k altánu - cestou otevře\n...                       tajnou chodbu v Mramorové síni)\nKdyž ti čaroděj vyrazí lampu z ruky (kouzlo Feeble), hned napiš\nVEZMI LAMPU - ve tmě tě sežere grue!\nU altánu:\ndovnitř\nčekej\nčekej                    (přijede jednorožec, princezna ti dá klíček a růži)\nven\nj\nz\nz                        (Mramorová síň)\nvezmi cihlu\nj                        (Kolotočová síň)\npolož cihlu\npolož růži\nsz\ns\ns\ns                        (Dračí doupě)\nvezmi sošku\nj\nz                        (Síň fresek)\nz                        (Vstup do banky)\n\n\n8. ZORKSKÁ BANKA                                             (+45 bodů)\n----------------\nJak funguje třpytivá clona v Úschovně: zavede tě podle toho, odkud jsi\ndo Úschovny naposledy vešel. Přišel jsi od ZÁPADNÍ přepážky (z) → clona\nvede ven do prohlížecí místnosti. Přišel jsi z kanceláře (s) → Malá\nmístnost. Stěny Malé místnosti a trezoru vedou zpátky do Úschovny.\nS poklady nejde odejít normálními dveřmi (spustí se alarm).\nsz                       (Západní přepážka)\nz                        (Úschovna)\nj                        (Kancelář předsedy)\nvezmi portrét\ns\npolož portrét\nvejdi do clony           (Malá místnost)\nvejdi do jižní stěny     (zpátky v Úschovně)\nvejdi do clony           (Trezor - nezdržuj se tu!)\nvezmi bankovky\nvejdi do severní stěny   (Úschovna)\npolož bankovky\nz <script>
/*
 * Úprava českého vstupu před předáním hře - přirozené tvary, kterým překlad
 * sám nerozumí (hra se kvůli tomu nemusí znovu sestavovat, uložené pozice platí):
 *   odpověz studna        -> odpověz "studna"      (hra chce slovo v uvozovkách)
 *   démone, dej mi hůlku  -> démon, dej hůlku ke mně
 *   nasaď psovi obojek    -> polož obojek na psa
 * Stejná pravidla má okno a konzole na počítači (okno.py: normalize_input).
 */
(function (root) {
  'use strict';

  function fold(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  var QUOTE_VERBS = ['odpovez', 'odpoved', 'rekni', 'vyslov', 'pronesi', 'zaklinej', 'zarikej'];
  // 5. pád oslovení, který slovník hry nezná
  var VOCATIVE = { demone: 'démon', gnome: 'gnóm', princezno: 'princezna', jednorozce: 'jednorožec',
    pse: 'pes', kerbere: 'kerber', netvore: 'netvor' };
  var GIVE = ['dej', 'podej', 'vrat', 'daruj'];
  var ME = ['mi', 'mne'];
  var PUT_ON = ['nasad', 'navlec', 'pripni'];
  var DOG = ['psovi', 'kerberovi', 'cerberovi', 'netvorovi'];

  function normalize(line) {
    var t = line.trim();
    if (!t) return line;
    // oslovení postavy: první slovo před čárkou
    var m = /^([^,\s]+)(\s*,.*)$/.exec(t);
    if (m && VOCATIVE[fold(m[1])]) t = VOCATIVE[fold(m[1])] + m[2];
    // „X, dej mi Y“ -> „X, dej Y ke mně“
    m = /^(.*,\s*)(\S+)\s+(\S+)\s+(.+)$/.exec(t);
    if (m && GIVE.indexOf(fold(m[2])) >= 0 && ME.indexOf(fold(m[3])) >= 0) {
      t = m[1] + m[2] + ' ' + m[4] + ' ke mně';
    }
    // „nasaď psovi obojek“ / „nasaď obojek psovi“ -> „polož obojek na psa“
    var w = t.split(/\s+/).map(fold);
    if (w.length >= 3 && PUT_ON.indexOf(w[0]) >= 0) {
      var rest = w.slice(1).filter(function (x) { return x !== 'si'; });
      var dog = rest.filter(function (x) { return DOG.indexOf(x) >= 0; });
      var thing = rest.filter(function (x) { return DOG.indexOf(x) < 0; });
      if (dog.length === 1 && thing.length >= 1) t = 'polož ' + thing.join(' ') + ' na psa';
    }
    // „odpověz studna“ -> „odpověz "studna"“
    var p = t.split(/\s+/);
    if (p.length === 2 && t.indexOf('"') < 0 && t.indexOf(',') < 0 && QUOTE_VERBS.indexOf(fold(p[0])) >= 0) {
      t = p[0] + ' "' + p[1] + '"';
    }
    return t;
  }

  root.zorkNormalize = normalize;
  if (typeof module !== 'undefined') module.exports = normalize;
})(typeof window !== 'undefined' ? window : this);

<script>
/* ZORK II česky - aplikace pro telefon: obrázek, mapa, inventář, směry, text a příkazy. */
(function () {
  'use strict';

  var D = window.ZORK_DATA;
  var SYM = D.sym;
  var $ = function (id) { return document.getElementById(id); };

  var DIR_CMD = { NORTH: 'sever', SOUTH: 'jih', EAST: 'východ', WEST: 'západ', NE: 'sv', NW: 'sz',
    SE: 'jv', SW: 'jz', UP: 'nahoru', DOWN: 'dolů', IN: 'dovnitř', OUT: 'ven' };
  var DIR_OFS = { NORTH: [0, -1], SOUTH: [0, 1], EAST: [1, 0], WEST: [-1, 0], NE: [1, -1],
    NW: [-1, -1], SE: [1, 1], SW: [-1, 1], UP: [0.5, -1], DOWN: [-0.5, 1], IN: [0.5, 0.5],
    OUT: [-0.5, -0.5] };
  var OPPOSITE = { NORTH: 'SOUTH', SOUTH: 'NORTH', EAST: 'WEST', WEST: 'EAST', NE: 'SW', SW: 'NE',
    NW: 'SE', SE: 'NW', UP: 'DOWN', DOWN: 'UP', IN: 'OUT', OUT: 'IN' };

  // ------------------------------------------------------------ úložiště
  var store = {
    get: function (k, def) {
      try { var v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); }
      catch (e) { return def; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); return true; }
      catch (e) { return false; }
    },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* nic */ } },
    keys: function (prefix) {
      var out = [];
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.indexOf(prefix) === 0) out.push(k);
        }
      } catch (e) { /* nic */ }

    }
  };

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);

  }

    c.mem = bytesToB64(st.mem);

  }
  function unpackState(st) {
    var c = JSON.parse(JSON.stringify(st));
    c.mem = Array.prototype.slice.call(b64ToBytes(st.mem));
    return c;
  }

  // ------------------------------------------------------------ hra
  var zm = new ZMachine(b64ToBytes(D.story));
  var req = null;          // na co hra čeká
  var snap = null;         // poslední stav (místnost, východy, inventář)
  var transcript = [];     // [{c: 'cmd'|'txt'|'sys', t: text}]

  // ------------------------------------------------------------ text
  var logEl = $('log');

  function addLog(text, cls, noSave) {
    if (!text) return;
    var div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = text;
    logEl.appendChild(div);
    while (logEl.childNodes.length > 1500) logEl.removeChild(logEl.firstChild);
    if (!noSave) {
      transcript.push({ c: cls || 'txt', t: text });
      if (transcript.length > 3000) transcript.splice(0, transcript.length - 3000);
    }
    logEl.scrollTop = logEl.scrollHeight;
  }

  function renderTranscript() {
    logEl.innerHTML = '';
    transcript.forEach(function (e) { addLog(e.t, e.c === 'txt' ? '' : e.c, true); });
  }

  function flushOutput() {
    var t = zm.output;
    zm.output = '';
    t = t.replace(/\s*>\s*$/, '').replace(/^\n+/, '').replace(/\n{3,}/g, '\n\n');
    if (t.trim()) addLog(t);
  }

  // ------------------------------------------------------------ běh hry
  function handle(r) {
    req = r;
    flushOutput();
    if (r.type === 'input' || r.type === 'char') {
      afterTurn();
      return;
    }
    if (r.type === 'save') { saveDialog(r); return; }
    if (r.type === 'restore') { restoreDialog(); return; }
    if (r.type === 'quit') {
      addLog('[Hra skončila. Menu ☰ → Začít znovu.]', 'sys');
      store.del('zork2.auto');
    }
  }

  // přirozené české tvary, kterým hra sama nerozumí (vstup_cz.js)
  var fixQuotes = window.zorkNormalize || function (l) { return l; };

  function send(line) {
    if (!req || (req.type !== 'input' && req.type !== 'char')) return;
    addLog('>' + line, 'cmd');
    try {
      if (req.type === 'char') handle(zm.resumeChar(line.charAt(0) || '\n'));
      else handle(zm.resumeInput(fixQuotes(line)));

      addLog('[Chyba interpretu: ' + e.message + ']', 'sys');
    }
  }

  function afterTurn() {
    var s = zm.snapshotState(SYM);
    var prev = snap;
    if (!s.room) { snap = s; return; }
    if (prev && s.moves < prev.moves && pendingRestoreMap === null) map.clear();
    if (pendingRestoreMap) { map.fromJSON(pendingRestoreMap); pendingRestoreMap = null; }
    snap = s;
    map.visit(s);
    updateStatus();
    updateInventory();
    updatePad();
    if (!prev || prev.here !== s.here || prev.lit !== s.lit) showPicture();
    autosave();
  }
  var pendingRestoreMap = null;

  function updateStatus() {
    $('status').textContent = (snap.lit ? snap.name : 'Tma') + ' · skóre ' + snap.score + ' · tahy ' + snap.moves;
  }

  function autosave() {
    if (!req || req.type !== 'input') return;
    store.set('zork2.auto', {
      state: packState(zm.snapshot()),
      req: { type: req.type, text: req.text, parse: req.parse, store: req.store },
      log: transcript.slice(-1500),
      map: map.toJSON()

  }

  // ------------------------------------------------------------ inventář
  function updateInventory() {
    var ul = $('inv');
    ul.innerHTML = '';
    var items = snap.inv || [];
    if (!items.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '(nic)';
      ul.appendChild(li);
      return;
    }
    items.forEach(function (it) {
      var li = document.createElement('li');
      li.textContent = '• ' + it;
      li.onclick = function () { insertText(it + ' '); };
      ul.appendChild(li);
    });
  }

  function insertText(t) {
    var inp = $('cmd');
    var v = inp.value;
    if (v && !/\s$/.test(v)) v += ' ';
    inp.value = v + t;
    inp.focus();
  }

  // ------------------------------------------------------------ směry
  function updatePad() {
    var dirs = snap && snap.lit ? snap.dirs : [];
    Array.prototype.forEach.call(document.querySelectorAll('#pad button'), function (b) {
      var d = b.getAttribute('data-d');
      b.classList.toggle('on', d === 'LOOK' || dirs.indexOf(d) >= 0);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#pad button'), function (b) {
    b.onclick = function () {
      var d = b.getAttribute('data-d');
      send(d === 'LOOK' ? 'rozhlédni se' : DIR_CMD[d]);
    };
  });

  // ------------------------------------------------------------ mapa
  // pevné rozložení podle původní mapy (místnosti se odkrývají až po návštěvě)
  var LAYOUT = D.layout || {};
  var DIAMONDS = [179, 180, 181, 182, 183, 184, 185, 186, 188];   // 9 šikmých místností

  var map = {
    pos: {}, names: {}, exits: {}, current: null, scale: store.get('zork2.mapScale', 40), off: [0, 0], manual: false,
    clear: function () { this.pos = {}; this.names = {}; this.exits = {}; this.current = null; this.draw(); },
    toJSON: function () {
      return { pos: this.pos, names: this.names, exits: this.exits, current: this.current };
    },
    fromJSON: function (d) {

      this.current = d.current || null; this.manual = false;
      for (var r in this.pos) if (LAYOUT[r]) this.pos[r] = LAYOUT[r].slice();

    free: function (p) {

        var q = this.pos[k];
        if (Math.abs(p[0] - q[0]) <= 0.45 && Math.abs(p[1] - q[1]) <= 0.45) return false;
      }
      return true;
    },
    place: function (near, d) {
      var want = d ? [near[0] + DIR_OFS[d][0] * 1.5, near[1] + DIR_OFS[d][1] * 1.5]

      for (var rad = 1; rad < 12; rad++) {
        for (var i = 0; i < 8 * rad; i++) {

      if (!this.pos[room]) {
        if (!Object.keys(this.pos).length) this.pos[room] = [0, 0];
        else {
          var d = null, dd;
          if (prev && this.exits[prev]) {
            for (dd in this.exits[prev]) if (this.exits[prev][dd] === room) { d = dd; break; }
          }
          if (!d) for (dd in s.exits) if (s.exits[dd] === prev) { d = OPPOSITE[dd]; break; }
          this.pos[room] = this.place(this.pos[prev] || [0, 0], d);
        }
      }
      if (room !== this.current) this.manual = false;

    canvas: $('map'),
    boxes: [],

      var w = c.clientWidth, h = c.clientHeight;
      if (!w || !h) return;
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
        c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);

      g.setTransform(dpr, 0, 0, dpr, 0, 0);

            g.fillStyle = '#c99a3c';
            g.font = 'bold 11px sans-serif';
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText('?', e[0] + o[0] * 6, e[1] + o[1] * 6);
          }
        }

      g.font = '11px "Segoe UI", Roboto, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';

        var p = sp(this.pos[r]);
        var name = this.names[r] || '?';
        if (DIAMONDS.indexOf(+r) >= 0) name = '◇';
        if (name.length > 16) name = name.slice(0, 15) + '…';
        var tw = g.measureText(name).width + 12, th = 18;
        var cur = String(r) === String(this.current);
        var x0 = p[0] - tw / 2, y0 = p[1] - th / 2;
        g.fillStyle = cur ? '#4a3612' : '#22252c';
        g.strokeStyle = cur ? '#e0ac47' : '#5b6170';
        g.lineWidth = cur ? 2 : 1;

        g.fill(); g.stroke();
        g.fillStyle = cur ? '#fff1cf' : '#d8d3c4';
        g.fillText(name, p[0], p[1] + 0.5);
        this.boxes.push({ room: r, x0: x0, y0: y0, x1: x0 + tw, y1: y0 + th });
      }
    },
    tap: function (x, y) {
      for (var i = 0; i < this.boxes.length; i++) {
        var b = this.boxes[i];
        if (x >= b.x0 - 4 && x <= b.x1 + 4 && y >= b.y0 - 6 && y <= b.y1 + 6) {
          if (String(b.room) === String(this.current)) { send('rozhlédni se'); return; }
          var ex = this.exits[this.current] || {};
          for (var d in ex) if (String(ex[d]) === String(b.room)) { send(DIR_CMD[d]); return; }
          addLog('[' + (this.names[b.room] || '?') + ' není přímo vedle.]', 'sys', true);

    g.beginPath();
    g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);

    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);

  (function mapGestures() {
    var c = map.canvas, start = null, moved = false;
    c.addEventListener('pointerdown', function (e) {

      if (moved) {
        map.manual = true;
        map.off = [start.off[0] + dx, start.off[1] + dy];
        map.draw();

    var job = queue;

      pumpTimer = setTimeout(pump, Math.min(1000, wait));
      return;
    }
    queue = null;
    busy = true;
    if (picWant === job) picMsg('generuji obrázek…');
    var prompt = (D.scenes[job.name] || FALLBACK) + ', ' + STYLE;
    var url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) +

  // ---- pixel art: zaostřit, posunout barvy do zelena, paleta 30 barev, dithering, obrysy
  var PAL = ['040605', '0a100c', '111a14', '182619', '203322', '2a4229', '35532f', '416636', '517d3b',

  var BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

  function rgb2hsv(r, g, b) {

  function renderPixelArt(bmp) {
    var W = PIC_W, H = PIC_H;
    // zmenšení 480×270 -> 240×135 (průměr 2×2 dělá prohlížeč při kreslení do malého plátna)
    var big = document.createElement('canvas');
    big.width = 480; big.height = 270;
    var bg = big.getContext('2d');
    bg.drawImage(bmp, 0, 0, 480, Math.round(bmp.height * 480 / bmp.width));
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    g.imageSmoothingQuality = 'high';

  function renderPixels(bmp) {
    var W = 480, H = 270;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;

  function smooth(ch, w, h, rad, sc) {
    var n = w * h, o = [new Float32Array(n), new Float32Array(n), new Float32Array(n)];

  function kresba(d, w, h) {

    var lum = new Float32Array(n);
    for (i = 0; i < n; i++) lum[i] = 0.3 * sm[0][i] + 0.59 * sm[1][i] + 0.11 * sm[2][i];

    var lo = srt[Math.floor(n / 50)];
    var hi = Math.max(lo + 30, srt[n - Math.floor(n / 100) - 1]);
    var tint = [1.0, 0.96, 0.86];
    var L = function (x, y) {
      x = x < 0 ? 0 : x >= w ? w - 1 : x;
      y = y < 0 ? 0 : y >= h ? h - 1 : y;

    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {

        var gx = -L(x - 1, y - 1) - 2 * L(x - 1, y) - L(x - 1, y + 1) + L(x + 1, y - 1) + 2 * L(x + 1, y) + L(x + 1, y + 1);

  // ------------------------------------------------------------ uložení a nahrání
  function slotKeys() {
    return store.keys('zork2.save:').map(function (k) { return k.slice('zork2.save:'.length); }).sort();
  }

  function saveDialog(r) {
    openSheet('dlg');
    $('dlgtitle').textContent = 'Uložit hru';
    var body = $('dlgbody');
    body.innerHTML = '';
    var inp = document.createElement('input');
    inp.placeholder = 'název pozice';
    inp.value = (snap && snap.name) ? snap.name + ' ' + (snap.moves || 0) : 'pozice';
    body.appendChild(inp);
    var row = document.createElement('div');
    row.className = 'row';
    var ok = document.createElement('button');
    ok.textContent = '💾 Uložit';
    row.appendChild(ok);
    body.appendChild(row);
    var keys = slotKeys();
    if (keys.length) {
      var note = document.createElement('p');
      note.className = 'note';
      note.textContent = 'Nebo přepsat existující:';
      body.appendChild(note);
      keys.forEach(function (k) {
        var b = document.createElement('button');
        b.style.display = 'block'; b.style.width = '100%'; b.style.marginTop = '6px'; b.style.textAlign = 'left';
        b.textContent = k;
        b.onclick = function () { inp.value = k; ok.onclick(); };
        body.appendChild(b);
      });
    }
    var done = function (success) {
      dlgCancel = null;
      closeSheets();
      handle(zm.resumeSave(success));
    };
    dlgCancel = function () { handle(zm.resumeSave(false)); };
    ok.onclick = function () {
      var name = inp.value.trim() || 'pozice';
      var okSave = store.set('zork2.save:' + name, {
        state: { state: packState(r.state.state), store: r.state.store },
        log: transcript.slice(-1500), map: map.toJSON(), date: new Date().toISOString(),
        room: snap ? snap.name : ''
      });
      if (!okSave) addLog('[Pozici se nepodařilo uložit - plná paměť?]', 'sys');
      done(okSave);
    };
  }

  function restoreDialog() {
    openSheet('dlg');
    $('dlgtitle').textContent = 'Nahrát hru';
    var body = $('dlgbody');
    body.innerHTML = '';
    var keys = slotKeys();
    dlgCancel = function () { handle(zm.resumeRestore(null)); };
    if (!keys.length) {
      var p = document.createElement('p');
      p.className = 'note';
      p.textContent = 'Zatím nemáš žádnou uloženou pozici.';
      body.appendChild(p);
      return;
    }
    keys.forEach(function (k) {
      var slot = store.get('zork2.save:' + k, null);
      var div = document.createElement('div');
      div.className = 'slot';
      var b = document.createElement('button');
      b.innerHTML = '';
      b.appendChild(document.createTextNode(k + ' '));
      var sm = document.createElement('small');
      sm.textContent = slot && slot.date ? new Date(slot.date).toLocaleString('cs-CZ') : '';
      b.appendChild(sm);
      b.onclick = function () {
        dlgCancel = null;
        closeSheets();
        if (!slot) { handle(zm.resumeRestore(null)); return; }
        transcript = (slot.log || []).slice();
        renderTranscript();
        addLog('— nahraná pozice —', 'sys');
        pendingRestoreMap = slot.map || null;
        snap = null;
        handle(zm.resumeRestore({ state: unpackState(slot.state.state), store: slot.state.store }));
      };
      var del = document.createElement('button');
      del.textContent = '🗑';
      del.onclick = function () {
        if (confirm('Smazat pozici „' + k + '“?')) { store.del('zork2.save:' + k); div.remove(); }
      };
      div.appendChild(b);
      div.appendChild(del);
      body.appendChild(div);
    });
  }

  // ------------------------------------------------------------ příkazový řádek
  var history = [];
  $('cmdform').onsubmit = function (e) {
    e.preventDefault();
    var v = $('cmd').value;
    $('cmd').value = '';
    if (v.trim()) history.push(v);
    send(v);
  };
  $('cmd').addEventListener('focus', function () {
    document.body.classList.add('typing');
    setTimeout(function () { logEl.scrollTop = logEl.scrollHeight; }, 300);
  });
  $('cmd').addEventListener('blur', function () {
    setTimeout(function () {
      if (document.activeElement !== $('cmd')) {
        document.body.classList.remove('typing');
        map.draw();
      }
    }, 150);
  });
  logEl.addEventListener('click', function () { $('cmd').blur(); });

  // ------------------------------------------------------------ start
  function start() {
    var auto = store.get('zork2.auto', null);
    if (auto && auto.state && auto.req) {
      try {
        zm.loadSnapshot(unpackState(auto.state));
        zm.pending = auto.req;
        transcript = auto.log || [];
        renderTranscript();
        addLog('— pokračuješ tam, kde jsi skončil —', 'sys', true);
        if (auto.map) map.fromJSON(auto.map);
        req = auto.req;
        afterTurn();
        return;
      } catch (e) {
        zm.reset();
        transcript = [];
        logEl.innerHTML = '';
      }
    }
    handle(zm.run());
  }
  start();
})();

</script>
</body>
</html>
